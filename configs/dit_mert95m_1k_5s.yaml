seed: 42

data:
  root: data/MTG-Jamendo-1000-24k-mono-5s
  manifest_dir: data/MTG-Jamendo-1000-24k-mono-5s/manifests
  dit_manifest_dir: data/MTG-Jamendo-1000-24k-mono-5s/dit_manifests
  text_embedding_dir: data/MTG-Jamendo-1000-24k-mono-5s/text_embeddings/t5gemma-s-s-ul2
  sample_rate: 24000
  duration_seconds: 5.0
  channels: 1
  num_workers: 8
  pin_memory: true

autoencoder:
  type: semantic
  config_path: configs/smoke_test_mert95m_1k_5s_5epoch.yaml
  checkpoint_path: runs/smoke_test_mert95m_1k_5s_5epoch/checkpoints/best.pt
  normalizer:
    enabled: false
    stats_path: null
    eps: 1.0e-8

dit:
  model_dim: 768
  text_dim: 512
  depth: 11
  num_heads: 8
  mlp_multiplier: 4.0
  dropout: 0.0
  repa:
    enabled: true
    layer: 2
    loss_weight: 1.0

conditioning:
  cross_attention: true
  duration_conditioning: true
  text_encoder:
    model_name: google/t5gemma-s-s-ul2
    max_length: 256
    batch_size: 16
    cache_dir: data/MTG-Jamendo-1000-24k-mono-5s/text_embeddings/t5gemma-s-s-ul2
    frozen: true

diffusion:
  prediction_type: x_prediction
  t_eps: 0.05
  timestep_sampler:
    type: truncated_logit_normal
    mean: 0.0
    std: 1.0
    truncation: 0.075
    rescale: true
    flip: false
  sampling:
    steps: 50
    guidance_scale: 1.0
    guidance_interval: [0.1, 1.0]

optimizer:
  type: muon_adamw
  parameter_assignment: qkv_and_ff
  muon:
    lr: 1.0e-5
    momentum: 0.95
    weight_decay: 0.0
    ns_steps: 5
  adamw:
    lr: 1.0e-6
    betas: [0.9, 0.95]
    weight_decay: 0.01
    eps: 1.0e-8

training:
  output_dir: runs/dit_mert95m_1k_5s
  epochs: 100
  batch_size: 8
  grad_accumulation_steps: 2
  mixed_precision: bf16
  amp: true
  grad_clip_norm: 1.0
  lr_scheduler: warmup_cosine
  warmup_steps: 150
  min_lr_ratio: 0.05
  log_every_steps: 20
  validate_every_steps: 200
  checkpoint_every_steps: 2000
  max_validation_batches: null
  resume_from: null
  num_validation_samples: 5
  listening:
    selection_seed: 30042
    noise_seed: 20042
    validation_seed: 10042

evaluation:
  output_dir: outputs/dit_mert95m_1k_5s
  batch_size: 8
  sampling_steps: 50
  seed: 42
  max_batches: null
  run_after_training: true
  gfad:
    enabled: true
    model: vggish
